{% extends "dayz/base.html" %}{% block dayz_content %}<form method="post" class="deadside-form"><section class="deadside-panel"><h2>📡 Radar zone</h2><label class="toggle-row"><input type="checkbox" name="radar_enabled" {% if dayz.radar_enabled %}checked{% endif %}><span>Enable radar</span></label><div class="deadside-grid"><label>Channel<select name="radar_channel"><option value="">Choose</option>{% for c in channels %}<option value="{{ c.id }}" {% if dayz.radar_channel|string==c.id|string %}selected{% endif %}>#{{ c.name }}</option>{% endfor %}</select></label><label>Ping role<select name="radar_ping_role"><option value="">None</option>{% for r in roles %}<option value="{{ r.id }}" {% if dayz.radar_ping_role|string==r.id|string %}selected{% endif %}>{{ r.name }}</option>{% endfor %}</select></label><label>Centre X<input type="number" name="radar_center_x" value="{{ dayz.radar_center_x }}"></label><label>Centre Z<input type="number" name="radar_center_z" value="{{ dayz.radar_center_z }}"></label><label>Radius metres<input type="number" name="radar_radius" value="{{ dayz.radar_radius }}"></label><label>Interval seconds<input type="number" min="60" name="radar_interval_seconds" value="{{ dayz.radar_interval_seconds }}"></label></div><p class="deadside-help">Uses latest adminLogPlayerList positions.</p></section><div class="deadside-actions"><button>Save radar</button></div></form>{% endblock %}
