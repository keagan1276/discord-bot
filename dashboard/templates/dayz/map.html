{% extends "dayz/base.html" %}{% block dayz_content %}<section class="deadside-panel"><h2>🗺 Approximate player heat map</h2><p class="deadside-help">Latest admin-log positions; not live GPS.</p><div class="dayz-map">{% for p in positions %}<div class="dayz-map-dot" style="left:{{ (p.x/dayz.map_size*100)|round(2) }}%;top:{{ (100-p.z/dayz.map_size*100)|round(2) }}%" title="{{ p.name }} X {{ p.x|round }}, Z {{ p.z|round }}"></div>{% endfor %}</div>{% for b in bounties %}<span class="dayz-bounty-label">{{ b.target_gamertag }} • ${{ b.amount }}</span>{% endfor %}</section>{% endblock %}
