{% extends "dayz/base.html" %}{% block dayz_content %}<form method="post"><section class="deadside-panel"><h2>💰 Shared economy</h2><label class="toggle-row"><input type="checkbox" name="pay_per_kill_enabled" {% if dayz.pay_per_kill_enabled %}checked{% endif %}><span>Pay per kill into existing wallet</span></label><div class="deadside-grid"><label>Pay per kill<input type="number" name="pay_per_kill" value="{{ dayz.pay_per_kill }}"></label><label>Minimum bounty<input type="number" name="minimum_bounty" value="{{ dayz.minimum_bounty }}"></label><label>Maximum bounty<input type="number" name="maximum_bounty" value="{{ dayz.maximum_bounty }}"></label></div><p class="deadside-help">Commands: /dz bounty and /dz bounties.</p></section><div class="deadside-actions"><button>Save economy</button></div></form>{% endblock %}
