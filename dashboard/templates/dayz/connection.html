{% extends "dayz/base.html" %}{% block dayz_title %}Nitrado Connection{% endblock %}{% block dayz_content %}<form method="post" class="deadside-form"><div class="deadside-grid"><section class="deadside-panel"><h2>Nitrado</h2><label class="toggle-row"><input type="checkbox" name="enabled" {% if dayz.enabled %}checked{% endif %}><span>Enable DayZ</span></label><label>Server name<input name="server_name" value="{{ dayz.server_name }}"></label><label>Platform<select name="platform"><option value="pc">PC</option><option value="xbox">Xbox</option><option value="playstation">PlayStation</option></select></label><label>Map<input name="map_name" value="{{ dayz.map_name }}"></label><label>Map size<input type="number" name="map_size" value="{{ dayz.map_size }}"></label><label>Nitrado service ID<input name="nitrado_service_id" value="{{ dayz.nitrado_service_id }}" required></label><label>Nitrado API token<input type="password" name="nitrado_api_token" placeholder="{% if dayz.api_token_configured %}Saved — leave blank to keep it{% else %}Bearer token{% endif %}"></label></section><section class="deadside-panel"><h2>Nitrado FTPS admin log</h2><label>Host<input name="ftp_host" value="{{ dayz.ftp_host }}" required></label><label>Port<input type="number" name="ftp_port" value="{{ dayz.ftp_port or 21 }}"></label><label>Username<input name="ftp_username" value="{{ dayz.ftp_username }}" required></label><label>Password<input type="password" name="ftp_password" placeholder="{% if dayz.ftp_password_configured %}Saved — leave blank to keep it{% else %}FTPS password{% endif %}"></label><label>Admin log path<input name="admin_log_path" value="{{ dayz.admin_log_path }}" required></label><label>Poll interval<input type="number" min="30" max="900" name="poll_interval" value="{{ dayz.poll_interval }}"></label></section></div><div class="deadside-actions"><button>Save & test Nitrado</button></div></form>{% endblock %}
