{% extends "dayz/base.html" %}{% block dayz_content %}<div class="content-grid two"><section class="deadside-panel"><h2>Create faction</h2><form method="post"><input type="hidden" name="action" value="add"><label>Name<input name="name" required></label><label>Leader gamertag<input name="leader"></label><label>Members<textarea name="members" placeholder="One gamertag per line"></textarea></label><label>Discord role<select name="role_id"><option value="">None</option>{% for r in roles %}<option value="{{ r.id }}">{{ r.name }}</option>{% endfor %}</select></label><label>Colour<input type="color" name="color" value="#991111"></label><button>Create faction</button></form></section><section class="deadside-panel"><h2>Factions</h2>{% for f in factions %}<div class="dayz-list-row"><div><strong>{{ f.name }}</strong><small>Leader {{ f.leader }} • {{ f.members|length }} members</small></div><form method="post"><input type="hidden" name="action" value="delete"><input type="hidden" name="faction_id" value="{{ f.id }}"><button class="danger-button">Delete</button></form></div>{% else %}<p>No factions.</p>{% endfor %}</section></div>{% endblock %}
